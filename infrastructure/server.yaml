AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  One EC2 host running the chat app: nginx serves the built React frontend on port 80,
  and a systemd-managed Node.js process runs the WebSocket/API server (server.js) on
  port 8080. The deploy workflow pushes app code and secrets over SSH after boot.

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues: [dev, prod]
    Description: Names the resources

  VpcId:
    Type: AWS::EC2::VPC::Id

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: >-
      A subnet whose route table has 0.0.0.0/0 pointing at an internet gateway. The
      workflow verifies this before deploying, so you never have to check by hand.

  InstanceType:
    Type: String
    Default: t3.micro
    # Inside both lab guardrails: Ec2RestrictInstanceTypes allows nano/micro/small/medium.
    AllowedValues: [t2.nano, t2.micro, t2.small, t3.nano, t3.micro, t3.small]

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Default: vockey
    Description: The key pair the Learner Lab gives you. The deploy workflow uses it for SSH

  SshCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: >-
      Who may SSH on port 22. GitHub-hosted runners have no fixed IP address, so this has
      to stay open for the deploy step to work. Acceptable in a lab, never in production.

  WsCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: Who may reach the WebSocket server directly on port 8080.

Resources:
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub 'Web + chat server ${EnvironmentName}'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP (nginx, serves the built frontend)
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: !Ref WsCidr
          Description: WebSocket (server.js) - the frontend connects here directly
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SshCidr
          Description: SSH for the deploy workflow
      Tags:
        - {Key: Name, Value: !Sub '${EnvironmentName}-web-sg'}

  WebServer:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      # Latest Amazon Linux 2023, looked up at deploy time instead of hardcoding an AMI id
      # that expires. Owner is amazon, which the lab policy requires.
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
      # The public IP is requested EXPLICITLY here rather than inherited from the subnet.
      # A subnet with "auto-assign public IPv4" turned off produces an instance with no
      # public address at all, and every health check then fails with no explanation.
      # Declaring the interface means SubnetId and the security group move inside it --
      # they must NOT also appear at this level, or CloudFormation rejects the template.
      NetworkInterfaces:
        - DeviceIndex: 0
          AssociatePublicIpAddress: true
          SubnetId: !Ref SubnetId
          GroupSet:
            - !Ref WebSecurityGroup
          DeleteOnTermination: true
      # No IamInstanceProfile on purpose: the lab policy grants no iam:PassRole, so attaching
      # one fails. That also means no SSM agent, which is why the workflow deploys over SSH.
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            # gp2, not gp3: the lab policy is an explicit Deny on any volume type outside
            # [gp2, standard]. 8 GiB is well under the 35 GiB ceiling.
            VolumeType: gp2
            VolumeSize: 8
            DeleteOnTermination: true
            Encrypted: true
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      Tags:
        - {Key: Name, Value: !Sub '${EnvironmentName}-web-server'}
        - {Key: Environment, Value: !Ref EnvironmentName}
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # Everything lands in /var/log/user-data.log and the console log, so a broken
          # instance can be diagnosed without logging in.
          exec > >(tee /var/log/user-data.log | logger -t user-data -s 2>/dev/console) 2>&1
          set -x

          WEBROOT=/usr/share/nginx/html
          APPDIR=/opt/chatapp
          echo "${EnvironmentName}" > /etc/site-env

          echo "=== [1/5] install nginx, node, rsync (retried: dnf mirrors are flaky at boot) ==="
          for attempt in 1 2 3 4 5; do
            dnf install -y nginx nodejs npm rsync && break
            echo "attempt $attempt failed, retrying in 10s"
            sleep 10
          done
          mkdir -p $WEBROOT
          mkdir -p $APPDIR
          chown -R ec2-user:ec2-user $APPDIR

          echo "=== [2/5] systemd unit for the chat server ==="
          # EnvironmentFile is prefixed with '-' so a missing .env (before the first deploy
          # has pushed one) does not stop the unit from being installed - it just means the
          # process has no Supabase credentials yet and will exit; Restart=on-failure keeps
          # it retrying quietly until the workflow pushes real code and secrets over SSH.
          cat > /etc/systemd/system/chatapp.service <<'UNIT'
          [Unit]
          Description=Chat app WebSocket server
          After=network.target

          [Service]
          Type=simple
          User=ec2-user
          WorkingDirectory=/opt/chatapp
          EnvironmentFile=-/opt/chatapp/.env
          ExecStart=/usr/bin/node /opt/chatapp/server.js
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          UNIT
          systemctl daemon-reload
          systemctl enable chatapp

          echo "=== [3/5] stop the browser caching the page ==="
          # Without this a refresh is served from the browser's own disk cache and your
          # deploy looks like it did nothing.
          cat > /etc/nginx/conf.d/nocache.conf <<'NOCACHE'
          add_header Cache-Control "no-store, no-cache, must-revalidate" always;
          NOCACHE

          echo "=== [4/5] placeholder page so the server answers immediately ==="
          # Real content lands moments later via the deploy workflow's rsync/ssh push.
          cat > $WEBROOT/index.html <<'FALLBACK'
          <!doctype html>
          <html><head><meta charset="utf-8"><title>Chat app</title></head>
          <body><h1>Starting up...</h1></body></html>
          FALLBACK
          printf 'ok\n' > $WEBROOT/health
          chown -R nginx:nginx $WEBROOT

          echo "=== [5/5] start services ==="
          systemctl enable --now nginx
          systemctl start chatapp || true
          echo "=== user-data complete ==="

Outputs:
  PublicIp:
    Value: !GetAtt WebServer.PublicIp
  URL:
    Description: Open this in a browser
    Value: !Sub 'http://${WebServer.PublicIp}'
  WebSocketUrl:
    Description: What the frontend connects to (matches its built-in default fallback)
    Value: !Sub 'ws://${WebServer.PublicIp}:8080'
  SshCommand:
    Value: !Sub 'ssh -i labsuser.pem ec2-user@${WebServer.PublicIp}'
